[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-loom"
version = "0.1.1"
description = "Evidence-driven, reversible maintenance for agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
skill-loom = "skillloom.cli:main"

[tool.setuptools.packages.find]
include = ["skillloom*"]
